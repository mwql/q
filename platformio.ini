[platformio]
default_envs = cyd_2432s028

[env:cyd_2432s028]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
build_src_filter = -<*> +<home_hub.cpp>
lib_deps =
  bodmer/TFT_eSPI @ ^2.5.43
  https://github.com/Bodmer/TFT_Touch.git
  tzapu/WiFiManager @ ^2.0.17
  bblanchon/ArduinoJson @ ^7.2.1
  h2zero/NimBLE-Arduino @ ^2.2.0
  crankyoldgit/IRremoteESP8266 @ ^2.8.6
build_flags =
  -D USER_SETUP_LOADED=1
  -D ILI9341_2_DRIVER=1
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=12
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=HIGH
  -D SPI_FREQUENCY=65000000
  -D SPI_READ_FREQUENCY=20000000
  -D TFT_INVERSION_ON=1
  -D LOAD_GLCD=1
  ; IRremoteESP8266 supports many air-conditioner protocols by default. The
  ; Home Hub transmits NEC only, which keeps this 4 MB CYD build lean.
  -D _IR_ENABLE_DEFAULT_=false
  -D SEND_NEC=true
  -D DECODE_NEC=false
